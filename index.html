<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Theme init: runs synchronously before any paint to prevent FOUC.
         Mirrors ThemeContext.getInitialTheme() exactly:
         1. Use saved 'portfolio-theme' preference if present.
         2. Otherwise fall back to the OS system preference via matchMedia. -->
    <script>
      (function () {
        var t = localStorage.getItem('portfolio-theme');
        var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = dark ? '#141018' : '#FFFBEF';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ilian BEN HAMOU — Étudiant en cybersécurité, recherche un contrat d'apprentissage." />
    <title>Ilian BEN HAMOU — Cybersécurité</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
