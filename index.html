<!doctype html>

    <!-- Synchronous init: sets theme class + html[lang] before first paint.
         Mirrors ThemeContext.getInitialTheme() and resolveInitialLang() exactly. -->
    <script>
      (function () {
        var t = localStorage.getItem('portfolio-theme');
        var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = dark ? '#141018' : '#FFFBEF';

        var urlLang = new URLSearchParams(window.location.search).get('lang');
        var savedLang = (urlLang === 'fr' || urlLang === 'en') ? urlLang : localStorage.getItem('portfolio-lang');
        if (savedLang !== 'fr' && savedLang !== 'en') {
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'fr';
          savedLang = nav.toLowerCase().startsWith('fr') ? 'fr' : 'en';
        }
        document.documentElement.lang = savedLang;
      })();
    </script>
