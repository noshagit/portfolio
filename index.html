<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Synchronous init: sets theme class + html[lang] before first paint.
         Mirrors ThemeContext.getInitialTheme() and LanguageContext's resolveInitialLang()
         exactly - the /en path prefix is the source of truth, ?lang= is a legacy fallback
         only (src/App.tsx normalizes it to a path on mount). -->
    <script>
      (function () {
        var t = localStorage.getItem('portfolio-theme');
        var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = dark ? '#141018' : '#FFFBEF';

        var lang = 'fr';
        if (window.location.pathname.indexOf('/en') === 0) {
          lang = 'en';
        } else {
          var urlLang = new URLSearchParams(window.location.search).get('lang');
          if (urlLang === 'en' || urlLang === 'fr') lang = urlLang;
        }
        document.documentElement.lang = lang;
      })();
    </script>

    <!-- ═══════════════════════════════════════════════════
         PRIMARY SEO
         Replace https://ilianbenhamou.fr with your domain.
         ═══════════════════════════════════════════════════ -->

    <meta id="meta-description" name="description" content="Portfolio professionnel d'Ilian Ben Hamou, étudiant en bachelor cybersécurité à Ynov Campus Lyon. Découvrez mon parcours, mes compétences techniques et mes projets." />
    <meta name="keywords" content="Ilian Ben Hamou, cybersécurité, portfolio, Lyon, Ynov, alternance, forensique, CTF, dev" />

    <!-- ═══════════════════════════════════════════════════════
         OPEN GRAPH  (Facebook, LinkedIn, Discord…)
         Static fallback for social-share bots, which don't execute JS - they always see

    <!-- ══════════════════════════════════════════════════════════
         HREFLANG — path-based locale (/ = FR, /en = EN), matching
         src/lib/routes.ts. Updated per-route by useDocumentMeta.ts.
         x-default → canonical FR URL.
         ══════════════════════════════════════════════════════════ -->

    <link id="hreflang-en"        rel="alternate" hreflang="en"        href="https://ilianbenhamou.fr/en" />
